# Cloud Build config for Enso's Cloud Run deployment (deployment batch,
# Stage 3). Invoked via:
#
#   gcloud builds submit --config=cloudbuild.yaml \
#     --substitutions=_NEXT_PUBLIC_FIREBASE_API_KEY=...,_NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=...,_NEXT_PUBLIC_FIREBASE_PROJECT_ID=... \
#     --service-account=projects/mirror-505915/serviceAccounts/enso-deploy@mirror-505915.iam.gserviceaccount.com
#
# Builds natively on Cloud Build's own amd64 workers — deliberately never a
# locally-built-then-pushed image. This project's dev environment is
# arm64; Cloud Run targets amd64, and local QEMU cross-emulation could not
# be bootstrapped there (see the Stage 1 report in the deployment batch) —
# Cloud Build sidesteps that gap entirely rather than working around it.
#
# NEXT_PUBLIC_FIREBASE_* are public-by-design values that Next.js inlines
# into the client bundle at BUILD time (see Dockerfile's ARGs) — they
# arrive here as substitutions, not as Cloud Run runtime env vars, which
# would do nothing: the client bundle is already finished by the time the
# container starts.
steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    # BuildKit is required — the Dockerfile's defensive sqlite-vec copy
    # uses `RUN --mount=type=bind`, a BuildKit-only feature. Cloud Build's
    # docker builder image does NOT default to BuildKit the way a local
    # `docker build` does; without this the build fails at that exact step
    # (confirmed live — this is not a precaution, it broke without it).
    env:
      - DOCKER_BUILDKIT=1
    args:
      - build
      - --build-arg=NEXT_PUBLIC_FIREBASE_API_KEY=${_NEXT_PUBLIC_FIREBASE_API_KEY}
      - --build-arg=NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
      - --build-arg=NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_NEXT_PUBLIC_FIREBASE_PROJECT_ID}
      - --tag=us-west1-docker.pkg.dev/$PROJECT_ID/enso/enso:$BUILD_ID
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - us-west1-docker.pkg.dev/$PROJECT_ID/enso/enso:$BUILD_ID

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - enso
      - --image=us-west1-docker.pkg.dev/$PROJECT_ID/enso/enso:$BUILD_ID
      - --region=us-west1
      - --service-account=enso-run@$PROJECT_ID.iam.gserviceaccount.com
      - --allow-unauthenticated
      - --port=8080
      # REQUIRED, not a default — the belt to the checkout/checkin lock's
      # braces (src/storage/userSession.ts). GcsStorageBackend's per-user
      # lock uses a real generation-precondition compare-and-swap, so it
      # holds correctly across instances in principle, but that guarantee
      # has only ever been exercised against a single instance (see
      # enso-rebuild-requirements.md Section 12 item 10). Do not raise this
      # without first getting real multi-instance verification of the lock
      # under concurrency — not just a re-read of the CAS logic.
      - --max-instances=1
      - --min-instances=0
      # Comma-safe delimiter (^;^) — kept even though GCS_BUCKET_NAME's own
      # value has no commas: harmless with a single key, and switching back
      # to the default comma syntax buys nothing now that ALLOWED_EMAILS
      # (the value that actually needed it) is gone from this flag — see
      # `gcloud topic escaping`.
      #
      # --update-env-vars, not --set-env-vars: the latter REMOVES ALL
      # EXISTING ENVIRONMENT VARIABLES FIRST (confirmed via `gcloud run
      # deploy --help`), which would silently wipe out any var set
      # directly in the Cloud Run console on every deploy — e.g.
      # ADMIN_EMAILS (report/entity-view batch, part 2), deliberately
      # never committed here since its real value should never live in
      # version control. --update-env-vars MERGES instead: it only
      # touches the keys listed below, leaving console-set vars alone.
      # IMPORTANT — --update-env-vars can only ADD or CHANGE a var, never
      # remove one: deleting a var (console-set or otherwise) requires
      # --remove-env-vars explicitly, named here, never assumed available
      # from this step alone.
      #
      # ALLOWED_EMAILS is deliberately not set here either, for the exact
      # same reason as ADMIN_EMAILS: it holds real testers' email
      # addresses, which should not live in version control any more than
      # the admin identity should. It used to be hardcoded on the line
      # below (two emails) — a real bug, found live: the deployed service's
      # actual allowlist had grown to four real testers via the Cloud Run
      # console, and this flag's SET-not-MERGE-per-key semantics meant the
      # next ordinary deploy would have silently reverted it back to two,
      # locking out two working testers with no error anywhere. Removed
      # entirely rather than "fixed" to the current four — any hardcoded
      # value here just becomes the next stale value the moment someone
      # adds or removes a tester via the console again.
      #
      # Both ADMIN_EMAILS and ALLOWED_EMAILS are therefore set OUT OF BAND
      # on the live service — via the Cloud Run console, or `gcloud run
      # services update --update-env-vars` — and are expected to persist
      # across every deploy run through this file, precisely because
      # neither is named in the flag below. A brand-new environment (a
      # fresh project, a service created from scratch) will therefore boot
      # with ALLOWED_EMAILS unset — and `lib/requireUser.ts`'s
      # allowedEmails() throws loud on that ("ALLOWED_EMAILS is not set...")
      # by design, the deliberate CONTRAST EN-110 records against
      # adminEmails()'s fail-CLOSED default (an absent ADMIN_EMAILS
      # silently returns no admins, never throws — a forgotten admin var
      # must never accidentally grant everyone admin access, the way a
      # thrown-and-ignored error pattern could). That crash on a genuinely
      # fresh environment is expected, not a bug: set ALLOWED_EMAILS once,
      # by hand, out of band — never by adding it back to this flag.
      - --update-env-vars=^;^GCS_BUCKET_NAME=mirror-505915-enso-user-data
      - --set-secrets=OPENAI_API_KEY=OPENAI_API_KEY:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,GOOGLE_MAPS_API_KEY=GOOGLE_MAPS_API_KEY:latest,FIREBASE_SERVICE_ACCOUNT_JSON=FIREBASE_SERVICE_ACCOUNT_JSON:latest

images:
  - us-west1-docker.pkg.dev/$PROJECT_ID/enso/enso:$BUILD_ID

options:
  logging: CLOUD_LOGGING_ONLY
